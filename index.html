<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Wright Place — An Exclusive Preview</title>
<meta name="description" content="An exclusive preview for a chosen few. The Wright Place — Luxury in the North. 800+ units inside the 3000+ acre KIADB Aerospace Park. Fairlark | GRC." />
<style>
  /* ---- Brochure fonts (self-hosted, exact faces from the GRC/KIADB artwork) ---- */
  @font-face{
    font-family:'Bodoni 72 Oldstyle';
    src:url('fonts/Bodoni72OS-Book.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Bodoni 72 Oldstyle';
    src:url('fonts/Bodoni72OS-Bold.woff2') format('woff2');
    font-weight:700; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Montserrat';
    src:url('fonts/Montserrat.woff2') format('woff2-variations'),
        url('fonts/Montserrat.woff2') format('woff2');
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  :root{
    --orange:#e07b45;
    --orange-deep:#d06f3b;
    --cream:#f6ebdd;
    --cream-soft:#f9f1e7;
    --ink:#3d2a1d;
    --ink-soft:#4a3324;
    --accent:#e07b45;
    --orange-text:#b95b28;   /* AA-safe orange for text on cream */
    --danger:#ffd9c2;
  }
  *{ margin:0; padding:0; box-sizing:border-box; font-style:normal !important; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:'Montserrat',system-ui,-apple-system,sans-serif;
    background:var(--orange);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  /* ---------- SINGLE-SCREEN STAGE (no scrolling) ---------- */
  .stage{
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:#e88148;              /* exact poster terracotta */
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
  }
  /* the real vector artwork — fills the top, whole poster visible, nudged up */
  .poster-art{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    object-fit:contain;
    object-position:center top;
    display:block;
  }
  .card{
    position:relative;
    width:min(430px,92vw);
    height:calc(100dvh - 58px);
    max-height:860px;
    background:var(--cream);
    border-radius:34px;
    padding:clamp(24px,4.2vh,40px) 30px 0;
    overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(78,40,15,.45);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .headline{
    font-family:'Bodoni 72 Oldstyle','Bodoni Moda',Georgia,serif;
    font-weight:400;
    font-size:clamp(31px,7.7vw,42px);
    line-height:1.08;
    text-align:center;
    color:var(--ink);
    letter-spacing:0;
  }
  .rule{
    width:78px; height:2px;
    background:var(--orange);
    margin:clamp(12px,2vh,20px) auto clamp(12px,2vh,18px);
    opacity:.85;
  }
  .sub{
    text-align:center;
    color:var(--orange-text);
    font-weight:500;
    font-size:clamp(15px,3.9vw,17px);
    line-height:1.42;
    max-width:78%;
  }

  /* big background plane */
  .plane-big{
    width:auto;
    height:clamp(104px,15vh,180px);
    max-width:118%;
    margin:clamp(2px,1vh,8px) 0;
    display:block;
    color:var(--orange);
    flex-shrink:0;
  }

  .codename{
    letter-spacing:.34em;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    margin-top:2px;
  }
  .mark{ width:64px; margin:clamp(8px,1.4vh,14px) 0 clamp(12px,1.8vh,20px); color:var(--orange); }

  .brand{
    font-family:'Bodoni 72 Oldstyle','Bodoni Moda',Georgia,serif;
    font-weight:700;
    color:var(--ink);
    text-align:center;
    letter-spacing:.03em;
    font-size:clamp(30px,7vw,40px);
    line-height:1.1;
    text-transform:uppercase;
  }
  .tagline{
    margin-top:clamp(10px,1.8vh,16px);
    color:var(--orange-text);
    letter-spacing:.22em;
    font-weight:600;
    font-size:13px;
    text-transform:uppercase;
  }

  .divider{
    width:82%;
    height:1px;
    background:rgba(61,42,29,.22);
    margin:clamp(14px,2.4vh,22px) 0 clamp(12px,2vh,18px);
  }
  .stats{
    text-align:center;
    line-height:1.35;
    margin-bottom:clamp(14px,2.2vh,22px);
  }
  .stats .row{ display:flex; align-items:baseline; justify-content:center; gap:10px; }
  .stats .num{
    font-family:'Bodoni 72 Oldstyle','Bodoni Moda',Georgia,serif;
    font-weight:700;
    font-size:clamp(26px,6vw,32px);
    color:var(--ink);
    min-width:104px;
    text-align:right;
  }
  .stats .txt{
    font-weight:500;
    font-size:clamp(14px,3.6vw,16px);
    color:var(--ink-soft);
    text-align:left;
  }

  .footer-pill{
    margin-top:auto;
    background:var(--orange);
    color:var(--cream);
    width:calc(100% + 68px);
    margin-left:-34px; margin-right:-34px;
    padding:20px 0 26px;
    border-top-left-radius:26px;
    border-top-right-radius:26px;
    text-align:center;
    font-weight:500;
    letter-spacing:.14em;
    font-size:18px;
  }
  .footer-pill b{ font-weight:600; }
  .footer-pill .divider-v{ opacity:.6; margin:0 8px; font-weight:300; }

  /* swipe-up affordance — a soft floating chevron button at the very bottom */
  .hint{
    position:absolute;
    right:16px; bottom:calc(16px + env(safe-area-inset-bottom));
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    background:rgba(224,123,69,.55);
    border:1px solid rgba(255,255,255,.55);
    border-radius:50%;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:0 6px 16px -6px rgba(60,28,8,.5);
    animation:floaty 1.9s ease-in-out infinite;
    pointer-events:none;
    z-index:5;
  }
  .hint span{ display:none; }              /* text label removed to keep the mark clean */
  .hint svg{ width:18px; height:18px; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }

  /* ---------- CTA PANEL ---------- */
  /* ---------- BOTTOM CTA (pinned to the base, poster's own palette) ---------- */
  .cta{
    flex:0 0 auto;
    background:#e88148;                 /* exact poster terracotta */
    padding:14px 24px calc(20px + env(safe-area-inset-bottom));
    text-align:center;
    color:var(--ink);
  }
  .glass{ width:100%; max-width:430px; margin:0 auto; }
  .glass .eyebrow{
    letter-spacing:.3em; font-size:10.5px; text-transform:uppercase;
    color:var(--ink); opacity:.72; font-weight:600; margin-bottom:6px;
  }
  .glass h2{
    font-family:'Bodoni 72 Oldstyle','Bodoni Moda',Georgia,serif;
    font-weight:400;
    font-size:clamp(22px,6vw,28px);
    line-height:1.1;
    color:var(--ink);
    letter-spacing:0;
  }
  .glass .rule2{ display:none; }
  .glass p{ display:none; }              /* keep the base compact — no scroll */
  form{ margin-top:12px; display:flex; flex-direction:column; gap:9px; }
  .field{
    width:100%;
    background:var(--cream);
    border:1px solid rgba(61,42,29,.18);
    border-radius:12px;
    padding:12px 15px;
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    font-weight:400;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .field::placeholder{ color:rgba(61,42,29,.5); }
  .field:focus{ border-color:var(--ink); box-shadow:0 0 0 3px rgba(61,42,29,.12); }
  .submit{
    margin-top:3px;
    background:var(--ink);
    color:var(--cream);
    border:none;
    border-radius:12px;
    padding:14px;
    font-family:'Bodoni 72 Oldstyle','Bodoni Moda',Georgia,serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:.04em;
    cursor:pointer;
    transition:transform .15s, box-shadow .2s, background .2s;
    box-shadow:0 12px 26px -14px rgba(40,20,6,.6);
  }
  .submit:hover{ transform:translateY(-2px); box-shadow:0 18px 34px -16px rgba(40,20,6,.65); }
  .submit:active{ transform:translateY(0); }
  .fineprint{
    margin-top:9px; font-size:11px; letter-spacing:.05em;
    color:var(--ink); opacity:.66; font-weight:500;
  }
  .thanks{
    display:none;
    padding:14px 0 6px;
    font-family:'Bodoni 72 Oldstyle','Bodoni Moda',Georgia,serif;
    font-size:19px; color:var(--ink); line-height:1.4;
  }
  .thanks.show{ display:block; }
  form.hide{ display:none; }

  /* field wrapper + inline validation */
  .fieldwrap{ text-align:left; }
  .field{ touch-action:manipulation; }
  .field.invalid{ border-color:#8f2f10; box-shadow:0 0 0 3px rgba(143,47,16,.14); }
  .err{
    display:none;
    margin:4px 4px 0;
    font-size:11.5px; font-weight:600; line-height:1.3;
    color:#7a2a0e;
    letter-spacing:.01em;
  }
  .err.show{ display:block; }
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  .submit{ touch-action:manipulation; }
  .submit[disabled]{ opacity:.75; cursor:progress; }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(246,235,221,.35); border-top-color:var(--cream);
    display:inline-block; vertical-align:-3px; margin-right:8px;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* visible keyboard focus */
  a:focus-visible, button:focus-visible, .field:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
    border-radius:12px;
  }

  /* respect reduced-motion */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important;
       transition-duration:.001ms !important; scroll-behavior:auto !important; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- exact vector artwork from the GRC/KIADB .ai — nudged to the top -->
  <img class="poster-art" src="hero.svg"
       alt="An Exclusive Preview for a Chosen Few — The Wright Place, Luxury in the North. 800+ homes right inside the 3000+ acre KIADB Aerospace & IT Park. Fairlark | GRC." />

  <!-- CTA pinned to the bottom of the same screen -->
  <section class="cta" id="cta">
    <div class="glass">
      <div class="eyebrow">Private Invitation</div>
      <h2>Be among the chosen few.</h2>

      <form id="regForm" novalidate>
        <div class="fieldwrap">
          <label class="visually-hidden" for="f-name">Full name (required)</label>
          <input class="field" id="f-name" type="text" name="name" placeholder="Full name"
                 autocomplete="name" required aria-required="true" aria-describedby="e-name" />
          <p class="err" id="e-name" role="alert">Please enter your name.</p>
        </div>
        <div class="fieldwrap">
          <label class="visually-hidden" for="f-phone">Phone number (required)</label>
          <input class="field" id="f-phone" type="tel" name="phone" placeholder="Phone number"
                 inputmode="tel" autocomplete="tel" required aria-required="true" aria-describedby="e-phone" />
          <p class="err" id="e-phone" role="alert">Please enter a valid phone number.</p>
        </div>
        <div class="fieldwrap">
          <label class="visually-hidden" for="f-email">Email address</label>
          <input class="field" id="f-email" type="email" name="email" placeholder="Email address"
                 inputmode="email" autocomplete="email" aria-describedby="e-email" />
          <p class="err" id="e-email" role="alert">Please enter a valid email address.</p>
        </div>
        <button class="submit" type="submit" id="submitBtn">Request Your Invitation</button>
      </form>
      <div class="thanks" id="thanks" role="status" aria-live="polite">Thank you. Our team will reach out with your private preview details shortly.</div>

      <div class="fineprint">Limited previews. By invitation only.</div>
    </div>
  </section>

</div>

<script>
  // graceful form handoff (no backend yet) with inline validation + submit feedback
  const form = document.getElementById('regForm');
  const thanks = document.getElementById('thanks');
  const btn = document.getElementById('submitBtn');
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const phoneRe = /[0-9]{7,}/;

  function validate(field){
    const v = field.value.trim();
    let ok = true;
    if (field.name === 'name')  ok = v.length > 0;
    if (field.name === 'phone') ok = phoneRe.test(v.replace(/[^0-9]/g,''));
    if (field.name === 'email') ok = v === '' || emailRe.test(v); // optional
    const err = document.getElementById('e-' + field.name);
    field.classList.toggle('invalid', !ok);
    field.setAttribute('aria-invalid', String(!ok));
    if (err) err.classList.toggle('show', !ok);
    return ok;
  }

  // validate on blur — not on every keystroke
  ['name','phone','email'].forEach(n => {
    form[n].addEventListener('blur', () => validate(form[n]));
    form[n].addEventListener('input', () => {
      if (form[n].classList.contains('invalid')) validate(form[n]);
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fields = ['name','phone','email'].map(n => form[n]);
    const results = fields.map(validate);
    const firstBad = fields.find((f,i) => !results[i]);
    if (firstBad){ firstBad.focus(); return; }

    // loading -> success feedback
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Sending…';
    setTimeout(() => {
      form.classList.add('hide');
      thanks.classList.add('show');
    }, 900);
  });
</script>
</body>
</html>
